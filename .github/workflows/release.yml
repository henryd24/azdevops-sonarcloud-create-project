name: Release

# Builds the Azure DevOps extension (.vsix) and publishes it as a GitHub Release.
#
# To ship a new version:
#   1. Bump the version in config/release.json and src/task.json (Major/Minor/Patch).
#   2. Merge to main, then push a matching tag:  git tag -s v1.3.0 -m v1.3.0 && git push origin v1.3.0
#
# Security notes:
# - Runs only on version tags or manually; never on pull requests.
# - No secrets are used. The .vsix is attached to the GitHub Release and can be uploaded
#   to the Marketplace by hand (or by a separate workflow with a protected environment).
# - Dependencies are installed with --ignore-scripts; third-party actions are SHA-pinned.
# - Write access (`contents: write`) is granted only to the job that creates the release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Read and validate version
        id: version
        run: |
          release_version=$(node -p "require('./config/release.json').version")
          task_version=$(node -p "const v=require('./src/task.json').version; v.Major+'.'+v.Minor+'.'+v.Patch")
          echo "release.json=$release_version task.json=$task_version"
          if [ "$release_version" != "$task_version" ]; then
            echo "::error::config/release.json ($release_version) and src/task.json ($task_version) versions differ"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$release_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension version v$release_version"
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Install task dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src

      - name: Install packaging tools (tfx-cli)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify registry signatures of installed packages
        run: |
          npm audit signatures
          npm audit signatures --prefix src

      - name: Typecheck
        run: npx --no-install tsc --noEmit -p tsconfig.json
        working-directory: src

      - name: Test
        run: npm test
        working-directory: src

      - name: Build task
        run: npm run build

      - name: Package extension
        run: >
          npx --no-install tfx extension create
          --manifest-globs vss-extension.json
          --overrides-file config/release.json
          --output-path out/

      - name: Check package
        run: |
          ls -l out/*.vsix
          test "$(ls out/*.vsix | wc -l)" -eq 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: out/*.vsix
          if-no-files-found: error

  release:
    # Only tag pushes publish a release; manual runs just produce the artifact above.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/*.vsix --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
