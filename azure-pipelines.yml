# End-to-end validation of the extension on real Azure Pipelines agents against SonarCloud.
#
# The task is bundled exactly as the extension packages it (ncc) and executed on Linux, Windows
# and macOS agents with scripts/e2e/run-task.js, which feeds it the inputs and an emulated
# service connection. The agent interprets the ##vso commands the task prints, so output
# variables are checked as in a real pipeline. Each job creates a throwaway PUBLIC project, runs the
# scenarios, verifies the result straight against the SonarCloud API and always deletes it.
#
# Required variable group "azdevops-sonarcloud-create-project" (Pipelines > Library):
#   SonarToken         (secret)  SonarCloud token with permission to create/delete projects
#   SonarOrganization            SonarCloud organization key
#
# The .vsix itself is built by GitHub Actions (.github/workflows/release.yml); this pipeline is the
# functional check for the release pull request, so the release is only merged if it works.

# Runs for every pull request so that its status check always reports (it is a required check on
# `main`; a check that never starts would block unrelated PRs). The SonarCloud E2E stage, which is
# the expensive part, only runs for release pull requests (branch release/*, opened by the Release
# workflow) and for manual runs from Azure DevOps.
trigger: none
pr:
  branches:
    include: [main]

variables:
  - name: NODE_VERSION
    value: 20.x

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: build
        displayName: Test and bundle the task
        # Runs on every PR, so it uses the self-hosted pool to avoid spending Microsoft-hosted minutes.
        pool:
          name: HenDa24
          demands: Agent.OS -equals Linux
        workspace:
          clean: all
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
              # Self-hosted agents cache old builds of 20.x; ncc needs >= 20.12 (crypto.hash).
              checkLatest: true
          - script: npm ci --ignore-scripts --no-audit --no-fund
            workingDirectory: src
            displayName: Install
          - script: npx --no-install tsc --noEmit -p tsconfig.json
            workingDirectory: src
            displayName: Typecheck
          - script: npm test
            workingDirectory: src
            displayName: Unit tests
          - script: npm run package
            workingDirectory: src
            displayName: Bundle task (ncc)
          - publish: dist/task
            artifact: task
            displayName: Publish bundled task

  - stage: E2E
    displayName: Validate against SonarCloud
    dependsOn: Build
    # Only for release PRs and manual runs. Secrets are not available to builds of forks, so skip there.
    condition: >-
      and(
        succeeded(),
        ne(variables['System.PullRequest.IsFork'], 'True'),
        or(
          eq(variables['Build.Reason'], 'Manual'),
          startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/release/')
        )
      )
    variables:
      - group: azdevops-sonarcloud-create-project
    jobs:
      # Linux runs on the self-hosted pool; Windows and macOS need Microsoft-hosted agents (these only run for release PRs).
      - job: e2e_linux
        displayName: E2E on
        timeoutInMinutes: 30
        strategy:
          matrix:
            linux_node20:
              nodeVersion: 20.x
              jobKey: linux20
            linux_node24:
              nodeVersion: 24.x
              jobKey: linux24
        pool:
          name: HenDa24
          demands: Agent.OS -equals Linux
        workspace:
          clean: all
        variables:
          # Non-secret variables reach every step as environment variables; SONAR_TOKEN is mapped per step.
          SONAR_ORGANIZATION: $(SonarOrganization)
          TASK_DIR: $(Pipeline.Workspace)/task
        steps:
          - template: .azure/e2e-steps.yml

      - job: e2e_hosted
        displayName: E2E on
        timeoutInMinutes: 30
        strategy:
          maxParallel: 2
          matrix:
            windows:
              vmImage: windows-latest
              nodeVersion: 20.x
              jobKey: win20
            macos:
              vmImage: macOS-latest
              nodeVersion: 20.x
              jobKey: mac20
        pool:
          vmImage: $(vmImage)
        variables:
          SONAR_ORGANIZATION: $(SonarOrganization)
          TASK_DIR: $(Pipeline.Workspace)/task
        steps:
          - template: .azure/e2e-steps.yml
